services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wildinfo-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
    networks:
      - wildinfo-network

  db:
    image: postgres:15-alpine
    container_name: wildinfo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wildinfo-network

  frontend:
    build: ./frontend
    container_name: wildinfo-frontend
    ports:
      - "80:80"
    environment:
      - BACKEND_URL=http://app:8000
    depends_on:
      - app
    restart: unless-stopped
    networks:
      - wildinfo-network

networks:
  wildinfo-network:
    driver: bridge

volumes:
  postgres_data:
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en WildInfo y comienza a explorar la biodiversidad del reino animal.">
    <title>Crear Cuenta - WildInfo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-icon">🌱</div>
            <h2>Crear Cuenta</h2>
            <p class="auth-desc">Únete a la comunidad de exploradores</p>
            
            <div id="errorMsg" class="error-msg"></div>
            <div id="successMsg" class="success-msg"></div>
            
            <form id="registroForm">
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required minlength="3" autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required minlength="4" autocomplete="new-password">
                    <p class="password-hint">Mínimo 4 caracteres</p>
                </div>
                
                <div class="input-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required minlength="4" autocomplete="new-password">
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">Crear Cuenta</button>
            </form>
            
            <p class="auth-switch">
                ¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a>
            </p>
            
            <div style="text-align:center; margin-top:1rem;">
                <a href="index.html" class="back-link">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? '/api' : 'https://wildinfo-api.onrender.com';
        
        const sesionGuardada = localStorage.getItem('usuario_wildinfo');
        if (sesionGuardada) {
            window.location.href = 'panel.html';
        }
        
        document.getElementById('registroForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            const successMsg = document.getElementById('successMsg');
            
            if (password !== confirmPassword) {
                errorMsg.textContent = 'Las contraseñas no coinciden';
                errorMsg.style.display = 'block';
                successMsg.style.display = 'none';
                return;
            }
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Creando cuenta...';
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            
            try {
                const res = await fetch(`${API_URL}/auth/registro`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    successMsg.textContent = '¡Cuenta creada! Redirigiendo al login...';
                    successMsg.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1500);
                } else {
                    const errorData = await res.json();
                    errorMsg.textContent = errorData.detail || 'Error al crear la cuenta';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'No se pudo conectar con el servidor. Verifica que la API esté corriendo.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Crear Cuenta';
            }
        });
    </script>
</body>
</html>

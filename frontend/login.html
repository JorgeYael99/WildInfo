<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WildInfo</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at center, #1e1e3f 0%, #0f172a 100%);
            padding: 1rem;
        }

        .auth-card {
            background: rgba(30, 41, 59, 0.7);
            padding: 3rem;
            border-radius: 24px;
            border: 1px solid rgba(74, 222, 128, 0.3);
            backdrop-filter: blur(15px);
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .auth-card h2 { color: #4ade80; margin-bottom: 0.5rem; }
        .auth-card p { color: #94a3b8; margin-bottom: 2rem; }

        .input-group { margin-bottom: 1.2rem; text-align: left; }
        .input-group label {
            display: block;
            color: #94a3b8;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }
        .input-group input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: white;
            outline: none;
            font-size: 1rem;
        }

        .input-group input:focus { border-color: #4ade80; }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: #4ade80;
            color: #0f172a;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 1rem;
        }

        .btn-submit:hover {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(74, 222, 128, 0.3);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .auth-switch {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: #94a3b8;
        }
        
        .auth-switch a { color: #4ade80; text-decoration: none; font-weight: bold; }
        .auth-switch a:hover { text-decoration: underline; }

        .error-msg {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 0.75rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 1.5rem;
            color: #64748b;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .back-link:hover { color: #4ade80; }
    </style>
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div style="font-size: 3rem; margin-bottom: 1rem;">🌍</div>
            <h2>Iniciar Sesión</h2>
            <p>Bienvenido de vuelta, explorador</p>
            
            <div id="errorMsg" class="error-msg"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">Entrar</button>
            </form>
            
            <p class="auth-switch">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
            
            <a href="index.html" class="back-link">← Volver al inicio</a>
        </div>
    </div>

<script>
        const API_URL = 'http://localhost:8000';
        
        // Si ya está logueado, ir directo al panel
        const sesionGuardada = localStorage.getItem('usuario_wildinfo');
        if (sesionGuardada) {
            window.location.href = 'panel.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';
            errorMsg.style.display = 'none';
            
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('usuario_wildinfo', JSON.stringify(data));
                    window.location.href = 'panel.html';
                } else {
                    const errorData = await res.json();
                    errorMsg.textContent = errorData.detail || 'Usuario o contraseña incorrectos';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'No se pudo conectar con el servidor. Verifica que la API esté corriendo.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>

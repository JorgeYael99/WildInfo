<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - WildInfo</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-icon">🌿</div>
            <h2>Iniciar Sesión</h2>
            <p class="auth-desc">Bienvenido de vuelta, explorador</p>
            
            <div id="errorMsg" class="error-msg"></div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>
                
                <button type="submit" class="btn-submit" id="submitBtn">Entrar</button>
            </form>
            
            <p class="auth-switch">
                ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
            </p>
            
            <div style="text-align:center; margin-top:1rem;">
                <a href="index.html" class="back-link">← Volver al inicio</a>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        const sesionGuardada = localStorage.getItem('usuario_wildinfo');
        if (sesionGuardada) {
            window.location.href = 'panel.html';
        }
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const errorMsg = document.getElementById('errorMsg');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';
            errorMsg.style.display = 'none';
            
            try {
                const res = await fetch(`${API_URL}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                if (res.ok) {
                    const data = await res.json();
                    localStorage.setItem('usuario_wildinfo', JSON.stringify(data));
                    window.location.href = 'panel.html';
                } else {
                    const errorData = await res.json();
                    errorMsg.textContent = errorData.detail || 'Usuario o contraseña incorrectos';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'No se pudo conectar con el servidor. Verifica que la API esté corriendo.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
            }
        });
    </script>
</body>
</html>

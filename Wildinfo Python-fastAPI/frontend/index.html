<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WildInfo - Buscador de Animales</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <h1>WildInfo</h1>
        <p>Descubre información e imágenes de animales</p>
    </header>

    <main>
        <section class="buscador">
            <input type="text" id="animalInput" placeholder="Escribe el nombre de un animal...">
            <button id="buscarBtn">Buscar</button>
        </section>

        <section id="resultado" class="resultado hidden">
            <div class="animal-info">
                <h2 id="animalNombre"></h2>
                <div class="detalles">
                    <p><strong>Reino:</strong> <span id="animalReino"></span></p>
                    <p><strong>Clase:</strong> <span id="animalClase"></span></p>
                    <p><strong>Familia:</strong> <span id="animalFamilia"></span></p>
                </div>
                <div id="wikipedia" class="wikipedia hidden">
                    <h3>Sobre este animal</h3>
                    <p id="resumenWikipedia"></p>
                    <a id="enlaceWikipedia" href="#" target="_blank">Leer más en Wikipedia</a>
                </div>
            </div>
            <div class="animal-imagen">
                <img id="animalImagen" src="" alt="Imagen del animal">
            </div>
            <button id="guardarBtn" class="btn-guardar">Guardar en favoritos</button>
        </section>

        <section class="favoritos">
            <h2>Animales Guardados</h2>
            <div id="listaFavoritos" class="lista-favoritos"></div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>
</html>

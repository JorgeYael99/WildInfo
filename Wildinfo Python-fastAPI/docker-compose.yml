version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: wildinfo-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    volumes:
      - ./fase1:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    command: uvicorn main1:app --reload --host 0.0.0.0 --port 8000

  db:
    image: postgres:15-alpine
    container_name: wildinfo-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
